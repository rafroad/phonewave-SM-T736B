[Service]
# The modem's file system from copies of modemst1, modemst2 and fsg (named as the partitions), read-only: -r keeps
# the modem's writes in memory, so nothing reaches storage. The kernel does not drive the UFS disk yet; the copies
# are the port's backups, installed by its tools/update-rootfs.sh (LOCAL ONLY: they hold the IMEI).
# -s: rmtfs starts the modem once it serves (the modem remoteproc does not boot by itself).
ExecStart=
ExecStart=/usr/bin/rmtfs -r -P -s -o /var/lib/gts7xllite-efs
